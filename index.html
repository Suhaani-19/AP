<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vivid Colorful Scenery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --pink: #ffcffc;
      --peach: #ffe3d5;
      --blue: #b2f7ff;
      --white-glow: #ffffff80;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at top left, var(--peach), var(--pink) 40%, var(--blue));
      border: 4px solid #ffffff70;
      box-shadow: inset 0 0 40px var(--white-glow);
      font-family: 'Segoe UI', system-ui, sans-serif;
      animation: fadeIn 1.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }

    h1 {
      position: fixed;
      top: 14px;
      left: 18px;
      font-size: 1.1rem;
      letter-spacing: 0.1rem;
      color: #ffffffdd;
      text-shadow: 0 0 12px #ffffff99;
      z-index: 100;
    }

    .sky {
      height: 60vh;
      background: linear-gradient(to bottom, #ffe3d5, #fffbcb 60%, #a8e0f4);
    }

    .sun {
      position: absolute;
      right: 15vw;
      top: 7vh;
      width: 130px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #fffde4 50%, #ffd452);
      box-shadow: 0 0 120px 60px #fffde466;
    }

    .cloud {
      position: absolute;
      width: 120px;
      height: 55px;
      background: #fff8fa;
      border-radius: 80px;
      opacity: 0.7;
      filter: blur(1.2px);
      animation: cloudMove linear infinite alternate;
    }

    .cloud.c1 { top: 12vh; left: 12vw; animation-duration: 18s }
    .cloud.c2 { top: 18vh; left: 38vw; width: 90px; animation-duration: 14s }
    .cloud.c3 { top: 14vh; left: 70vw; animation-duration: 22s }

    @keyframes cloudMove {
      to { transform: translateX(20vw); }
    }

    .hill {
      position: absolute;
      width: 100vw;
      left: 0;
    }

    .hill1 {
      bottom: 27vh;
      height: 28vh;
      background: linear-gradient(130deg, #ffe683, #ffa4b6);
      clip-path: ellipse(70vw 20vh at 50vw 100%);
    }

    .hill2 {
      bottom: 20vh;
      height: 26vh;
      background: linear-gradient(90deg, #54e6c1, #978efb);
      clip-path: ellipse(63vw 16vh at 40vw 100%);
    }

    .hill3 {
      bottom: 12vh;
      height: 19vh;
      background: linear-gradient(144deg, #f7b343, #72dffd);
      clip-path: ellipse(59vw 10vh at 48vw 100%);
    }

    .water {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 14vh;
      background: linear-gradient(to top, #62c9ff 80%, #fee3ec);
      border-radius: 20vw 80px 0 0;
      animation: shimmer 8s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      from { filter: brightness(1); }
      to { filter: brightness(1.08); }
    }

    .bird {
      position: absolute;
      top: 22vh;
      font-size: 28px;
      animation: fly 14s linear infinite;
    }

    @keyframes fly {
      from { transform: translateX(-15vw); }
      to { transform: translateX(115vw); }
    }

    .caption {
      position: absolute;
      bottom: 4vh;
      width: 100%;
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.18rem;
      color: #e64e5b;
      text-shadow: 0 0 32px #fffbcb88;
    }

    .ripple {
      position: fixed;
      width: 12px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      transform: translate(-50%, -50%);
      animation: ripple 1s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: translate(-50%, -50%) scale(7);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <h1>Trial Codes :</h1>

  <div class="sky"></div>
  <div class="sun"></div>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="hill hill1"></div>
  <div class="hill hill2"></div>
  <div class="hill hill3"></div>

  <div class="bird">🕊️</div>
  <div class="water"></div>

  <div class="caption">A World of Color Awaits 🌈</div>

  <script>
    (() => {
      const version = "1.1.0";
      console.log("Scenery loaded 🌈 | version:", version);

      document.addEventListener("keydown", e =>
        console.log("Key pressed:", e.key)
      );

      window.addEventListener("resize", () =>
        console.log("Window resized")
      );

      document.addEventListener("click", e => {
        const ripple = document.createElement("div");
        ripple.className = "ripple";
        ripple.style.left = e.clientX + "px";
        ripple.style.top = e.clientY + "px";
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 1000);
      });
    })();
  </script>
</body>
</html>
