<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivid Colorful Scenery</title>

  <style>
    :root {
      --pink: #ffcffc;
      --peach: #ffe3d5;
      --blue: #b2f7ff;
      --glass: rgba(255, 255, 255, 0.55);
      --glow: rgba(255, 255, 255, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;

      background: radial-gradient(
        ellipse at top left,
        var(--peach),
        var(--pink) 40%,
        var(--blue)
      );

      border: 4px solid rgba(255, 255, 255, 0.42);
      box-shadow: inset 0 0 50px var(--glow);

      /* ✨ Fade-in + subtle hue rotation for premium feel */
      animation: fadeIn 1.4s ease-out, bgShift 10s ease-in-out infinite alternate;
    }

    ...
  </style>
</head>

<body>
  <!-- 🧭 Fixed glassmorphism header label -->
  <header>Trial Codes :</header>

  <main class="scene" aria-label="Colorful scenery scene">
    ...
  </main>

  <script>
    (() => {
      const version = "2.0.0";
      console.log("Scenery loaded 🌈 | version:", version);

      /* 💧 Click-based ripple effect for interactive feedback */
      document.addEventListener("click", (e) => {
        const ripple = document.createElement("div");
        ripple.className = "ripple";
        ripple.style.left = e.clientX + "px";
        ripple.style.top = e.clientY + "px";
        document.body.appendChild(ripple);

        ripple.addEventListener("animationend", () => ripple.remove());
      });
    })();
  </script>
</body>
</html>
