<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivid Colorful Scenery</title>

  <style>
    :root {
      --pink: #ffcffc;
      --peach: #ffe3d5;
      --blue: #b2f7ff;
      --glass: rgba(255, 255, 255, 0.55);
      --glow: rgba(255, 255, 255, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;

      background: radial-gradient(
        ellipse at top left,
        var(--peach),
        var(--pink) 40%,
        var(--blue)
      );

      border: 4px solid rgba(255, 255, 255, 0.42);
      box-shadow: inset 0 0 50px var(--glow);
      animation: fadeIn 1.4s ease-out;

      /* ✅ One nice extra line (premium smooth shifting background) */
      animation: fadeIn 1.4s ease-out, bgShift 10s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(22deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      position: fixed;
      top: 14px;
      left: 18px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    /* Layers */
    .scene {
      position: relative;
      height: 100%;
      width: 100%;
    }

    .sky {
      height: 62vh;
      background: linear-gradient(to bottom, #ffe3d5, #fff7c2 55%, #9fe0ff);
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 6vh;
      right: 13vw;
      width: clamp(90px, 10vw, 140px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #fffde4 55%, #ffd452);
      box-shadow: 0 0 120px 50px rgba(255, 244, 187, 0.55);
      animation: pulse 6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); filter: brightness(1); }
      to { transform: scale(1.06); filter: brightness(1.06); }
    }

    /* Clouds */
    .cloud {
      position: absolute;
      border-radius: 80px;
      background: rgba(255, 250, 252, 0.9);
      filter: blur(1.1px);
      box-shadow: 0 14px 30px rgba(255,255,255,0.35);
      opacity: 0.85;
      animation: cloudFloat linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud::before {
      width: 55%;
      height: 90%;
      top: -45%;
      left: 12%;
    }

    .cloud::after {
      width: 45%;
      height: 75%;
      top: -35%;
      right: 10%;
    }

    .cloud.c1 { width: 140px; height: 55px; top: 12vh; left: -10vw; animation-duration: 24s; }
    .cloud.c2 { width: 105px; height: 45px; top: 18vh; left: -14vw; animation-duration: 18s; opacity: 0.75; }
    .cloud.c3 { width: 170px; height: 60px; top: 9vh; left: -20vw; animation-duration: 30s; opacity: 0.65; }

    @keyframes cloudFloat {
      from { transform: translateX(0); }
      to { transform: translateX(140vw); }
    }

    /* Hills */
    .hill {
      position: absolute;
      width: 100vw;
      left: 0;
      transform: translateZ(0);
    }

    .hill1 {
      bottom: 27vh;
      height: 30vh;
      background: linear-gradient(130deg, #ffe683, #ffa4b6);
      clip-path: ellipse(70vw 20vh at 50vw 100%);
    }

    .hill2 {
      bottom: 20vh;
      height: 28vh;
      background: linear-gradient(90deg, #54e6c1, #978efb);
      clip-path: ellipse(63vw 16vh at 40vw 100%);
    }

    .hill3 {
      bottom: 12vh;
      height: 20vh;
      background: linear-gradient(144deg, #f7b343, #72dffd);
      clip-path: ellipse(59vw 10vh at 48vw 100%);
    }

    /* Water */
    .water {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 16vh;
      border-radius: 20vw 80px 0 0;
      background: linear-gradient(to top, #62c9ff 82%, #fee3ec);
      animation: shimmer 7s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      from { filter: brightness(1); }
      to { filter: brightness(1.10); }
    }

    /* Birds */
    .bird {
      position: absolute;
      top: 22vh;
      font-size: clamp(20px, 2vw, 28px);
      animation: fly 16s linear infinite;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12));
    }

    .bird.b2 { top: 28vh; animation-duration: 20s; font-size: clamp(16px, 1.7vw, 24px); opacity: 0.8; }
    .bird.b3 { top: 18vh; animation-duration: 14s; opacity: 0.75; }

    @keyframes fly {
      from { transform: translateX(-20vw); }
      to { transform: translateX(120vw); }
    }

    /* Caption */
    .caption {
      position: absolute;
      bottom: 3.5vh;
      width: 100%;
      text-align: center;
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-weight: 800;
      letter-spacing: 0.16rem;
      color: #e64e5b;
      text-shadow: 0 0 30px rgba(255, 251, 203, 0.55);
      padding: 0 10px;
    }

    /* Ripple click effect */
    .ripple {
      position: fixed;
      width: 12px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      transform: translate(-50%, -50%);
      animation: ripple 1s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: translate(-50%, -50%) scale(7);
        opacity: 0;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>

<body>
  <header>Trial Codes :</header>

  <main class="scene" aria-label="Colorful scenery scene">
    <div class="sky"></div>
    <div class="sun" aria-hidden="true"></div>

    <div class="cloud c1" aria-hidden="true"></div>
    <div class="cloud c2" aria-hidden="true"></div>
    <div class="cloud c3" aria-hidden="true"></div>

    <div class="hill hill1" aria-hidden="true"></div>
    <div class="hill hill2" aria-hidden="true"></div>
    <div class="hill hill3" aria-hidden="true"></div>

    <div class="bird b1" aria-hidden="true">🕊️</div>
    <div class="bird b2" aria-hidden="true">🕊️</div>
    <div class="bird b3" aria-hidden="true">🕊️</div>

    <div class="water" aria-hidden="true"></div>
    <div class="caption">A World of Color Awaits 🌈</div>
  </main>

  <script>
    (() => {
      const version = "2.0.0";
      console.log("Scenery loaded 🌈 | version:", version);

      // Ripple effect (lightweight)
      document.addEventListener("click", (e) => {
        const ripple = document.createElement("div");
        ripple.className = "ripple";
        ripple.style.left = e.clientX + "px";
        ripple.style.top = e.clientY + "px";
        document.body.appendChild(ripple);

        ripple.addEventListener("animationend", () => ripple.remove());
      });
    })();
  </script>
</body>
</html>
